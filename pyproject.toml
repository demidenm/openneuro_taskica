[project]
name = "openneuro-taskica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Demidenko", email = "demidenko.michael@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.2",
    "scipy<1.16",
    "scikit-learn<1.8",
    "statsmodels==0.14.5",
    "nibabel==5.4.2",
    "pillow==12.2.0",
    "nilearn==0.11.0",
    "matplotlib==3.10.1",
    "nbformat>=5.8.0",
    "IPython>=8.0.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "pyrelimri==2.2.3",
    "templateflow==24.2.2",
    "argparse",
    "setuptools",
    "pybids @ git+https://github.com/bids-standard/pybids.git@26b3f7e",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[project.scripts]
openneuro-taskica = "openneuro_taskica:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
